<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media query</title>

    <style>
        .box{
            width:400px;
            height:400px;
            background-color: aqua;
            border: 3px solid black;
        }
        @media (min-width:500px){        /*    or    @media (max-width:500px)*/    /* we also write @media (min-width:300px) and (max-width:600px) */
            .box{
                background-color: brown;
            }
        }
    </style>
</head>
<body>
    <div class = "box">
        hello jee
          
    </div>
</body>
</html>
